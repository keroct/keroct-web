name = "keroct-cms-site"
main = "src/index.js"
compatibility_date = "2026-10-26"
workers_dev = true

[assets]
directory = "../_pages"
binding = "ASSETS"
run_worker_first = true
html_handling = "auto-trailing-slash"

[vars]
CMS_ORIGIN = "https://cms-origin-not-configured.invalid"
CMS_TEAM_ID = ""
CMS_SITE_KEY = "keroct"
